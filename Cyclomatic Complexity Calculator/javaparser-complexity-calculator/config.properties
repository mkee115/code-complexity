# =============================================================================
# ComplexityCalculator configuration
# Run with:  mvn exec:java               (uses this file)
#        or: mvn exec:java -Dexec.args="path/to/other.properties"
# Leave a value blank to omit that filter / use no value.
# =============================================================================

# LOCAL_PATH | GITHUB_REPO | GITHUB_SEARCH
run.mode=GITHUB_SEARCH

# LOCAL_PATH: a .java file or a directory to scan recursively
local.input=

# GITHUB_REPO: full clone URL of a single repository
single.repo.url=

# ---- GitHub search filters (GITHUB_SEARCH) -- blank = omit the filter --------
search.language=java
search.minStars=10
search.minForks=10
search.minSizeKb=
search.maxSizeKb=
search.pushedAfter=2026-01-01
search.minCommits=

# Max repositories to collect, and the upper bound on repo creation date
search.targetRepos=5000
search.createdBefore=2026-01-01

# ---- Output -----------------------------------------------------------------
# append=true keeps existing CSV rows and skips repos already in repos.csv
# (resumable); append=false overwrites the output files from scratch.
output.append=false
output.dir=..\\analysis\\data_tables

# Plain-text file containing a GitHub personal access token
token.file=.\\.token

# Parallel clone/parse workers (GITHUB_SEARCH). Tune to your CPU / network.
threads=4
